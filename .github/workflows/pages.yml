name: Deploy archive review
on:
  workflow_dispatch:
    inputs:
      production:
        description: Build the final-domain archive as a download only (never deploy)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - snapshot.json
      - prepare.py

permissions:
  contents: read

concurrency:
  group: ${{ inputs.production == true && 'production-preparation' || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Download and verify frozen public snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("snapshot.json"))["tag"])')
          gh release download "$tag" --pattern bokeh-discourse-archive.zip
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          manifest = json.load(open('snapshot.json'))
          archive = Path('bokeh-discourse-archive.zip')
          with archive.open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == manifest['sha256']
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              for item in bundle.infolist():
                  path = Path(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              bundle.extractall('_site')
          PY
      - name: Check review and production preparation
        run: python3 -m unittest discover -s tests
      - name: Prepare review project paths
        if: ${{ inputs.production != true }}
        run: python3 prepare.py _site --base-path /discourse.bokeh.org/
      - name: Prepare final-domain archive without deploying
        if: ${{ inputs.production == true }}
        run: python3 prepare.py _site --base-path / --production
      - name: Validate the complete production archive
        if: ${{ inputs.production == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .cache _validation
          gh release download "$(python3 -c 'import json; print(json.load(open("source-snapshot.json"))["tag"])')" --pattern public-source-2026-10-28.zip --dir .cache
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from rebuild import asset, extract
          source = json.load(open('source-snapshot.json'))
          extract(asset(source, source['asset']), Path('_validation'))
          PYCODE
          cp archive/validate.py _validation/validate.py
          ln -s "$PWD/_site" _validation/site
          python3 _validation/validate.py
      - name: Package the production archive
        if: ${{ inputs.production == true }}
        run: tar -C _site -czf production-archive.tar.gz .
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.production == true }}
        with:
          name: production-archive
          path: |
            production-archive.tar.gz
            _validation/validation.json
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: ${{ inputs.production != true }}
        with:
          path: _site
  deploy:
    if: ${{ inputs.production != true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy review
        id: deployment
        uses: actions/deploy-pages@v4
