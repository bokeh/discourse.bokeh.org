{% if pagination and pagination.total_pages > 1 %}<nav class="paging" aria-label="Pagination">{% if pagination.has_prev %}<a href="{{ 'index.html' if pagination.prev_page==1 else 'page-' ~ pagination.prev_page ~ '.html' }}">← Previous</a>{% endif %}<span>Page {{ pagination.current_page }} of {{ pagination.total_pages }}</span>{% if pagination.has_next %}<a href="page-{{ pagination.next_page }}.html">Next →</a>{% endif %}</nav>{% endif %}
